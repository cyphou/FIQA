name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    # Windows is not a nicety here. The worst defect this project has shipped was
    # platform-only: with core.autocrlf=true a CRLF blank line in .gitignore parses
    # as an EMPTY pattern that matches every directory, so deleting a real ignore
    # rule was undetectable and the evidence-sink gate passed vacuously. Linux
    # checks out LF unconditionally and can never reproduce it. The same is true of
    # the octal-quoting `git ls-files` does to non-ASCII names. A gate that only
    # runs where the bug cannot happen is not a gate.
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.12", "3.13"]

    defaults:
      run:
        # Every step below is bash (heredocs, `set +e`, `$?`). windows-latest
        # defaults to pwsh, where those are syntax errors, so pin the shell once
        # here rather than rewriting each step twice.
        shell: bash

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Verify no runtime dependency crept in
        run: |
          python - <<'PY'
          import tomllib
          with open("pyproject.toml", "rb") as handle:
              deps = tomllib.load(handle)["project"]["dependencies"]
          assert deps == [], f"core engine must stay stdlib-only, found: {deps}"
          print("stdlib-only: ok")
          PY

      - name: Verify .gitignore is checked out LF
        run: |
          python - <<'PY'
          with open(".gitignore", "rb") as handle:
              data = handle.read()
          assert b"\r" not in data, (
              ".gitignore checked out with CRLF: git reads every blank line as an empty "
              "pattern matching each directory, so a deleted directory rule stops being "
              "detectable. Restore `.gitignore text eol=lf` in .gitattributes."
          )
          print("gitignore eol: lf ok")
          PY

      - name: Run test suite
        run: python -m unittest discover -s tests -t . -v

      - name: Check agent file ownership
        run: python scripts/check_agent_ownership.py

      - name: Check evidence sinks stay untracked and identifier-free
        run: python scripts/check_evidence_sinks.py

      - name: Check the scope ledger disposes every element in code
        run: python scripts/check_scope_ledger.py

      - name: Check rule documentation is current
        run: python scripts/build_rules_doc.py --check

      - name: End-to-end assessment on sample fixtures
        run: python assess.py --inventory examples/sample_tenant --review --out artifacts

      - name: Verify blocking findings set exit code 2
        run: |
          set +e
          python assess.py --inventory examples/sample_tenant --quiet \
            --out artifacts --fail-on-blocking
          code=$?
          set -e
          if [ "$code" -ne 2 ]; then
            echo "expected exit code 2 for blocking findings, got $code"
            exit 1
          fi
          echo "blocking gate: ok"

      - name: Upload assessment artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          # upload-artifact@v4 rejects a duplicate artifact name, so the OS has to
          # be in it once the matrix spans two platforms.
          name: assessment-${{ matrix.os }}-py${{ matrix.python-version }}
          path: artifacts/
          retention-days: 7
